<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title></title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="chrome">
  <div id="tabs"></div>
  <div id="bar">
    <button id="back" title="Back">&#8592;</button>
    <button id="fwd" title="Forward">&#8594;</button>
    <button id="reload" title="Reload">&#8635;</button>
    <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
    <select id="newprofile" class="hidden" title="Profile for new tabs"></select>
    <button id="add" title="New tab">+</button>
    <button id="gear" title="Settings">&#9881;</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
