name: build
on:
  workflow_dispatch:
    inputs:
      all:
        description: "Also build Windows and emulated 32-bit/armv7 Linux"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p strata-core

  # Native Linux builds link the distro's own WebKitGTK/GTK; nothing is bundled.
  linux-native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,  runner: ubuntu-24.04 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo build --release -p strata
      - run: cp target/release/strata strata-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "strata-${{ matrix.name }}" }

  # 32-bit targets are built natively inside a Debian container under qemu (slow, best effort).
  linux-emulated:
    if: ${{ inputs.all }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-armv7, platform: linux/arm/v7 }
          - { name: linux-x86,   platform: linux/386 }
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/src -w /src debian:trixie bash -ec '
            apt-get update
            apt-get install -y curl build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . ~/.cargo/env
            cargo build --release -p strata
            cp target/release/strata strata-${{ matrix.name }}'
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "strata-${{ matrix.name }}" }

  windows:
    if: ${{ inputs.all }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64,  runner: windows-latest,  target: x86_64-pc-windows-msvc }
          - { name: windows-x86,     runner: windows-latest,  target: i686-pc-windows-msvc }
          - { name: windows-aarch64, runner: windows-11-arm,  target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release -p strata --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/strata.exe strata-${{ matrix.name }}.exe
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "strata-${{ matrix.name }}.exe" }
