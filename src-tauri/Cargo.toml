[package]
name = "strata"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "A lightweight, secure browser with isolated profiles"

[lib]
name = "strata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "unstable", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strata-core = { path = "../crates/strata-core" }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[features]
default = ["updater"]
updater = ["dep:ureq"]
