[package]
name = "strata"
version = "0.1.4"
edition = "2021"
license = "MPL-2.0"
description = "A lightweight, secure browser with isolated profiles"

[lib]
name = "strata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "unstable", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strata-core = { path = "../crates/strata-core" }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
webkit2gtk = { version = "2", features = ["v2_34"] }

[features]
default = ["updater", "custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
updater = ["dep:ureq"]
